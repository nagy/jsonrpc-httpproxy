[package]
name = "jsonrpc-httpproxy"
version = "0.1.0"
edition = "2024"

[lints.clippy]
# Run pedantic by default (no `-W clippy::pedantic` needed). `main()` (the
# stdin JSON-RPC loop) and `handle_connection` (the per-connection routing)
# are single long functions; splitting them for a ~20-line overflow is churn.
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

[dependencies]
clap = { version = "4", features = ["derive"] }
colog = "1.4.0"
ctrlc = "3"
derive_more = { version = "2.1.1", features = ["display", "error", "from"] }
http = "1.4.0"
httparse = "1.10.1"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "rt", "io-util"] }

# Library target: the whole program is one source file, shared by the lib
# and bin targets. The lib is needed for `cargo doc` and `cargo test --doc`,
# which fail with "no library targets found" on a bin-only crate.
[lib]
path = "main.rs"

[[bin]]
name = "jsonrpc-httpproxy"
path = "main.rs"
# The bin would overwrite the lib docs under target/doc/<crate>/ (same
# crate name); the library docs are the ones we ship.
doc = false
