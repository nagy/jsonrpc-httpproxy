[package]
name = "jsonrpc_httpproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
colog = "1.4.0"
http = "1.4.0"
httparse = "1.10.1"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }

[[bin]]
name = "jsonrpc_httpproxy"
path = "main.rs"
